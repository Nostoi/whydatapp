name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    name: Decide release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.d.outputs.version }}
      tag: ${{ steps.d.outputs.tag }}
      should_release: ${{ steps.d.outputs.should_release }}
      from_tag: ${{ steps.d.outputs.from_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        name: Detect version + decide whether to release
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            should_release=true
            from_tag=true
          else
            version=$(grep -m1 -E '^version' pyproject.toml | sed -E 's/version *= *"([^"]+)"/\1/')
            tag="v$version"
            from_tag=false
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              should_release=false
            else
              should_release=true
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "should_release=$should_release"
            echo "from_tag=$from_tag"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag should_release=$should_release from_tag=$from_tag"

  tag:
    name: Auto-tag main
    needs: decide
    # Must be branch-gated: a workflow_dispatch from a feature branch would otherwise
    # tag that branch's HEAD as the release. A stray tag then makes `decide` report
    # should_release=false on the real merge, silently skipping the release.
    if: >-
      needs.decide.outputs.should_release == 'true'
      && needs.decide.outputs.from_tag == 'false'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push tag
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.decide.outputs.tag }}" -m "${{ needs.decide.outputs.tag }}"
          git push origin "${{ needs.decide.outputs.tag }}"

  build:
    name: Build wheel + sdist
    needs: [decide, tag]
    if: |
      always()
      && needs.decide.outputs.should_release == 'true'
      && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Verify package version matches expected tag
        run: |
          set -e
          expected="${{ needs.decide.outputs.version }}"
          pkg=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(uv run python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/why/__init__.py').read()).group(1))")
          echo "expected=$expected pyproject=$pkg __init__=$init"
          if [ "$expected" != "$pkg" ] || [ "$expected" != "$init" ]; then
            echo "::error::Version mismatch — pyproject ($pkg) and __init__ ($init) must both equal $expected."
            exit 1
          fi

      # The shell-hook tests skip when their shell is absent, and ubuntu-latest ships
      # neither zsh nor fish. Without this the tests that exercise the real hook
      # scripts silently do not run in CI — which is how a hook that disabled all
      # recording on zsh once passed a fully green gate.
      - name: Install shells under test
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Run quality gate
        run: |
          uv pip install -e '.[dev,web]'
          uv run pytest -q
          uv run ruff check src tests
          uv run mypy src/why

      # A skip is a claim we have not checked. Fail loudly rather than let a missing
      # shell quietly shrink coverage back to nothing.
      - name: Assert no shell tests were skipped
        run: |
          uv run pytest -q -rs 2>&1 | tee /tmp/pytest-skips.txt
          if grep -qiE 'SKIPPED.*(zsh|bash|fish) not available' /tmp/pytest-skips.txt; then
            echo "::error::A shell under test was unavailable, so its hook tests did not run."
            grep -iE 'SKIPPED.*(zsh|bash|fish) not available' /tmp/pytest-skips.txt
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Tailwind CSS
        run: |
          npx --yes tailwindcss@3 -i src/why/web/static/css/tailwind.src.css \
                                  -o src/why/web/static/css/tailwind.css --minify
          if ! grep -q '\.flex' src/why/web/static/css/tailwind.css; then
            echo "::error::tailwind.css is missing utility classes — build failed."
            exit 1
          fi

      - name: Build distributions
        run: uv build

      # The quality gate above runs against uv.lock; users get whatever the resolver
      # picks from pyproject.toml. That gap shipped a release where every CLI-only
      # install crashed on `import click` (typer >= 0.27 vendored click and dropped
      # the dependency) while all 365 tests passed against the pinned typer 0.25.
      # Install the actual wheel with fresh resolution and run it.
      - name: Smoke-test the built wheel with freshly resolved dependencies
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/why_cli-*.whl)
          # Braces are required: "$WHEEL[web]" reads as array indexing to shellcheck
          # (SC1087), and zsh actually glob-expands it.
          for variant in "$WHEEL" "${WHEEL}[web]"; do
            echo "::group::$variant"
            rm -rf /tmp/smoke && uv venv -q /tmp/smoke
            uv pip install -q --python /tmp/smoke/bin/python "$variant"
            /tmp/smoke/bin/why --version
            WHY_HOME=$(mktemp -d) /tmp/smoke/bin/why list
            WHY_HOME=$(mktemp -d) /tmp/smoke/bin/why --help > /dev/null
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [decide, build]
    runs-on: ubuntu-latest
    # `always()` is load-bearing, not defensive. The rehearsal is dispatched from a
    # feature branch, where `tag` is correctly skipped (it is gated on refs/heads/main).
    # GitHub propagates a skip down the whole needs chain unless a job opts out with a
    # status function: `build` opts out via always(), but without the same here this job
    # inherits `tag`'s skip and can never run from a branch — which is exactly how
    # branch-gating auto-tag in 2.2.1 silently disabled the TestPyPI dry run.
    # `needs.build.result == 'success'` keeps always() from publishing a failed build.
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.decide.outputs.should_release == 'true'
      && github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/why-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [decide, build]
    runs-on: ubuntu-latest
    if: needs.decide.outputs.should_release == 'true' && github.event_name != 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/project/why-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  bump-homebrew:
    name: Bump Homebrew formula
    needs: [decide, publish-pypi]
    runs-on: ubuntu-latest
    # The package is already on PyPI by the time this runs, and it cannot be
    # unpublished. A tap that lagged one version must therefore never turn a
    # successful release red. `continue-on-error` covers the failures a missing
    # secret does not: a token that is expired, revoked, or scoped to the wrong
    # repository fails at checkout, which would otherwise fail the whole run
    # after publishing. The failure is still annotated below and visible on the
    # job, it just is not fatal.
    continue-on-error: true
    # Only after the version is actually on PyPI: the formula's url and sha256
    # point at the published sdist, so bumping earlier would commit a 404.
    # `always()` plus an explicit result check for the same reason publish-testpypi
    # needs it — a skip anywhere upstream in the needs chain propagates down unless
    # a job opts out for itself.
    if: >-
      always()
      && needs.publish-pypi.result == 'success'
      && needs.decide.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # The push target is a different repository, so GITHUB_TOKEN cannot reach it.
      # Missing credentials must not fail a release that already published: warn
      # and skip, leaving the tap one version behind rather than turning a
      # successful release red.
      - name: Check for the tap credential
        id: cred
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set — the Homebrew formula \
            will stay at the previous version. See docs/guide/development.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tap
        if: steps.cred.outputs.have == 'true'
        uses: actions/checkout@v4
        with:
          repository: Nostoi/homebrew-why
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # Plain python3, not `uv run`: the generator is stdlib-only by design and
      # shells out to the uv CLI for resolution, so it needs no project env.
      - name: Render the formula
        if: steps.cred.outputs.have == 'true'
        run: |
          set -euo pipefail
          python3 scripts/render_homebrew_formula.py \
            "${{ needs.decide.outputs.version }}" > tap/Formula/why-cli.rb
          head -8 tap/Formula/why-cli.rb
          test "$(grep -c '^  resource ' tap/Formula/why-cli.rb)" -gt 0

      - name: Commit and push
        if: steps.cred.outputs.have == 'true'
        working-directory: tap
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/why-cli.rb; then
            echo "formula already current for $VERSION — nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/why-cli.rb
          git commit -m "why-cli $VERSION

          Generated by scripts/render_homebrew_formula.py in Nostoi/whydatapp.
          Do not hand-edit: the next release overwrites this file."
          git push

      # Runs even when an earlier step failed, so a bad credential says so in
      # plain language instead of leaving a red checkout for someone to decode.
      - name: Explain a failed bump
        if: failure()
        run: |
          echo "::error::Could not update the Homebrew formula. why-cli \
          ${{ needs.decide.outputs.version }} IS published on PyPI — only the tap \
          lagged. Check that HOMEBREW_TAP_TOKEN is unexpired and has Contents: \
          read and write on Nostoi/homebrew-why, then re-run this job or bump the \
          formula by hand (see docs/guide/development.md)."

  github-release:
    name: Publish GitHub Release
    needs: [decide, build]
    runs-on: ubuntu-latest
    if: needs.decide.outputs.should_release == 'true' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          name: ${{ needs.decide.outputs.tag }}
          generate_release_notes: true
          files: dist/*
